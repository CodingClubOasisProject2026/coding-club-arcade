<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#11151c" />
    <title>Tetris</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="tetris-page-head">
      <a href="/" target="_top" class="back-link" aria-label="Back to arcade">
        <span aria-hidden="true">←</span> Back
      </a>
      <h1>Tetris</h1>
    </header>

    <main class="tetris-shell">
      <div class="game-layout">
        <aside class="side-column left-column">
          <div class="panel panel-stats">
            <div class="score-display-box">
              <span class="box-label">Score</span>
              <div id="score" class="score">000000</div>
            </div>

            <div class="stat-dual-grid">
              <div class="mini-stat-card">
                <span class="mini-stat-label">Lines</span>
                <strong id="lines" class="mini-stat-val">00</strong>
              </div>
              <div class="mini-stat-card">
                <span class="mini-stat-label">Level</span>
                <strong id="level" class="mini-stat-val">01</strong>
              </div>
            </div>
          </div>

          <div class="panel panel-preview">
            <span class="box-label">Next</span>
            <div class="preview-chamber">
              <div id="next-preview" class="preview-grid"></div>
            </div>
          </div>
        </aside>

        <div class="board-column">
          <div class="board-wrap">
            <span class="sr-only" id="game-state-label">READY</span>
            <span class="sr-only" id="elapsed">00:00</span>

            <div
              id="board"
              class="board"
              role="grid"
              aria-label="Tetris playfield"
            ></div>

            <div id="stack-callout" class="stack-callout" aria-live="polite" aria-atomic="true"></div>
            <div id="clear-callout" class="clear-callout" aria-live="polite" aria-atomic="true"></div>

            <div id="overlay" class="board-overlay">
              <div class="overlay-card">
                <h2 id="overlay-title" class="sr-only"></h2>
                <p id="overlay-copy" aria-live="polite"></p>
                <button id="start-button" class="primary-button">Start game</button>
              </div>
            </div>
          </div>

          <div class="keyboard-hints" aria-label="Keyboard controls">
            <span><kbd>←</kbd> <kbd>→</kbd> Move</span>
            <span><kbd>↑</kbd> Rotate</span>
            <span><kbd>↓</kbd> Drop</span>
            <span><kbd>Space</kbd> Hard drop</span>
            <span><kbd>P</kbd> Pause</span>
          </div>
          <div class="tetris-touch-controls" id="touch-controls" aria-label="Touch controls">
            <div class="touch-cluster touch-cluster-dpad">
              <button type="button" class="touch-btn touch-btn-dir" id="btn-touch-left" aria-label="Move Left">
                <span class="touch-arrow">◀</span>
              </button>
              <button type="button" class="touch-btn touch-btn-down" id="btn-touch-down" aria-label="Soft Drop">
                <span class="touch-arrow">▼</span>
                <span class="touch-label">DROP</span>
              </button>
              <button type="button" class="touch-btn touch-btn-dir" id="btn-touch-right" aria-label="Move Right">
                <span class="touch-arrow">▶</span>
              </button>
            </div>

            <div class="touch-cluster touch-cluster-center">
              <button type="button" class="touch-btn touch-btn-pause" id="btn-touch-pause" aria-label="Pause or Resume">
                <span class="touch-icon">⏸</span>
                <span class="touch-label">PAUSE</span>
              </button>
            </div>

            <div class="touch-cluster touch-cluster-actions">
              <button type="button" class="touch-btn touch-btn-slam" id="btn-touch-drop" aria-label="Hard Drop">
                <span class="touch-arrow">⤓</span>
                <span class="touch-label">SLAM</span>
              </button>
              <button type="button" class="touch-btn touch-btn-rotate" id="btn-touch-rotate" aria-label="Rotate Piece">
                <span class="touch-arrow">⟳</span>
                <span class="touch-label">ROTATE</span>
              </button>
            </div>
          </div>
        </div>

      </div>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
