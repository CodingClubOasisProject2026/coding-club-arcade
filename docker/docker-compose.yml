services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        python manage.py seed_games &&
        granian --interface wsgi --host 0.0.0.0 --port 8000 --workers 4 --blocking-threads 4 --respawn-failed-workers --workers-lifetime 3600 --workers-kill-timeout 30 config.wsgi:application"
    expose:
      - "8000"
    volumes:
      - static_files:/app/staticfiles
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
  db:
    image: postgres:17-alpine
    env_file:
      - .env
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  valkey:
    image: valkey/valkey:8-alpine
    # Append-only file so in-progress games (e.g. minesweeper) survive restarts.
    command: valkey-server --appendonly yes
    ulimits:
      memlock: -1
    volumes:
      - valkey_data:/data
    restart: unless-stopped
  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file:
      - .env
    command: >
      celery -A config worker
        --loglevel=INFO
        --concurrency=4
        --max-tasks-per-child=200
        --max-memory-per-child=250000
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  rabbitmq:
    image: rabbitmq:3.12-alpine
    env_file:
      - .env
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    healthcheck:
      # A port check is cheap; rabbitmq-diagnostics boots a full Erlang VM and can hang.
      test: ["CMD-SHELL", "nc -z localhost 5672"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  caddy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.caddy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddyfile:/etc/caddy/Caddyfile:ro
      - static_files:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  static_files:
  postgres_prod_data:
  caddy_data:
  caddy_config:
  rabbitmq_prod_data:
  valkey_data:
